<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberwarden — Keeper of the Last Lantern-Light</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #07050f;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    background: #0e0a1e;
    cursor: crosshair;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="status" aria-live="polite"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
